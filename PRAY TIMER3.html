<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة إقامة الصلاة - أيام العمل</title>
    <style>
        /* الشاشة سوداء تماماً في الوضع الافتراضي */
        body, html { 
            background-color: #000; 
            margin: 0; 
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* حاوية المحتوى مخفية افتراضياً وتظهر فقط في وقت العمل */
        #content-container {
            display: none; 
            background-image: url('image_5734c0.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            color: #fff; 
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.75);
            width: 100%; height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center;
        }
        
        .clock { font-size: 7vw; font-weight: bold; color: #00e676; margin-bottom: 5px; direction: ltr; }
        .date-info { font-size: 1.8vw; color: #ddd; margin-bottom: 15px; line-height: 1.5; }
        
        /* تصميم وقت الأذان */
        .adhan-time { 
            font-size: 2.2vw; color: #29b6f6; margin-bottom: 15px; font-weight: bold; 
            background: rgba(0,0,0,0.6); padding: 10px 25px; border-radius: 10px; border: 1px solid #29b6f6;
        }
        
        .prayer-info { margin: 15px 0; color: #ffeb3b; }
        .prayer-info .ar { font-size: 3vw; font-weight: bold; }
        .prayer-info .en { font-size: 2vw; direction: ltr; margin-top: 5px; color: #ffd54f; }
        
        .iqamah-timer { margin: 10px 0; min-height: 12vw; }
        .iqamah-timer .timer-numbers { font-size: 10vw; color: #ff3d00; font-weight: bold; direction: ltr; }
        
        /* تصميم صندوق الإشعار الإضافي (الرسالة الزائدة) وقت الصلاة */
        .praying-alert {
            display: none; 
            background-color: rgba(0, 230, 118, 0.15);
            border: 2px solid #00e676;
            border-radius: 15px;
            padding: 15px 30px;
            margin-top: 15px;
        }
        .praying-alert .msg-ar { font-size: 3.5vw; color: #00e676; font-weight: bold; line-height: 1.4; }
        .praying-alert .msg-en { font-size: 2vw; color: #b9f6ca; direction: ltr; margin-top: 8px; }

        .footer { font-size: 1.2vw; color: #aaa; position: absolute; bottom: 20px; width: 100%; text-align: center; line-height: 1.6;}
    </style>
</head>
<body>

    <div id="content-container">
        <div class="overlay">
            <div class="clock" id="current-time">00:00:00</div>
            <div class="date-info">
                <div id="date-ar"></div>
                <div id="date-en" dir="ltr"></div>
            </div>
            
            <div class="adhan-time" id="adhan-time-display">وقت الأذان: --:--</div>
            
            <div class="prayer-info">
                <div class="ar" id="prayer-info-ar"></div>
                <div class="en" id="prayer-info-en"></div>
            </div>
            
            <div class="iqamah-timer">
                <div class="timer-numbers" id="iqamah-timer"></div>
                
                <div class="praying-alert" id="praying-alert">
                    <div class="msg-ar">استووا واعتدلوا..<br>أقيموا الصفوف وأطفئوا الهواتف</div>
                    <div class="msg-en">Straighten the rows and turn off your phones</div>
                </div>
            </div>
            
            <div class="footer">
                الموقع: جبل علي، دبي | تحديث المواقيت يتم تلقائياً<br>
                <span dir="ltr">Location: Jebel Ali, Dubai | Timings updated automatically</span>
            </div>
        </div>
    </div>

    <script>
        let schedule = [];
        const prayerNamesEn = { 'الظهر': 'Dhuhr', 'العصر': 'Asr' };

        function formatTime12(dateObj) {
            return dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        async function fetchPrayerTimes() {
            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByAddress?address=Jebel+Ali,+Dubai,+UAE&method=8');
                const data = await response.json();
                const timings = data.data.timings;
                
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const date = now.getDate();

                function parseTime(timeStr) {
                    const [h, m] = timeStr.split(':');
                    return new Date(year, month, date, parseInt(h), parseInt(m), 0);
                }

                schedule = [
                    { 
                        name: 'الظهر', adhan: parseTime(timings.Dhuhr), 
                        iqamah: new Date(year, month, date, 13, 0, 0) // الإقامة 1:00 ظهراً
                    }, 
                    { 
                        name: 'العصر', adhan: parseTime(timings.Asr), 
                        iqamah: new Date(year, month, date, 16, 30, 0) // الإقامة 4:30 عصراً
                    }
                ];

                schedule.forEach(prayer => {
                    prayer.showTime = new Date(prayer.iqamah.getTime() - (30 * 60000));
                    prayer.hideTime = new Date(prayer.iqamah.getTime() + (10 * 60000));
                });
                
                document.getElementById('date-ar').innerText = data.data.date.hijri.weekday.ar + " | " + data.data.date.hijri.day + " " + data.data.date.hijri.month.ar + " " + data.data.date.hijri.year;
                document.getElementById('date-en').innerText = data.data.date.gregorian.weekday.en + " | " + data.data.date.gregorian.day + " " + data.data.date.gregorian.month.en + " " + data.data.date.gregorian.year;

            } catch (error) {
                console.error("خطأ في الاتصال");
            }
        }

        function updateScreen() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('en-US', { hour12: true });

            if (schedule.length === 0) return;

            let activePrayer = null;
            let currentState = 'BLACK_SCREEN'; 
            
            // جلب اليوم الحالي (0 = الأحد، 1 = الاثنين، 2 = الثلاثاء، 3 = الأربعاء، 4 = الخميس، 5 = الجمعة، 6 = السبت)
            const currentDay = now.getDay();

            // الشاشة تعمل فقط إذا لم يكن اليوم الجمعة (5) ولا السبت (6)
            if (currentDay !== 5 && currentDay !== 6) {
                for (let prayer of schedule) {
                    if (now >= prayer.showTime && now < prayer.hideTime) {
                        activePrayer = prayer;
                        currentState = (now < prayer.iqamah) ? 'COUNTDOWN' : 'PRAYING';
                        break;
                    }
                }
            }

            const container = document.getElementById('content-container');

            if (currentState === 'BLACK_SCREEN') {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            document.getElementById('adhan-time-display').innerHTML = `وقت أذان ${activePrayer.name}: &nbsp; <span dir="ltr">${formatTime12(activePrayer.adhan)}</span>`;

            const infoArEl = document.getElementById('prayer-info-ar');
            const infoEnEl = document.getElementById('prayer-info-en');
            const timerNumEl = document.getElementById('iqamah-timer');
            const alertBox = document.getElementById('praying-alert');

            if (currentState === 'COUNTDOWN') {
                alertBox.style.display = 'none';
                
                infoArEl.innerText = `الإقامة لصلاة ${activePrayer.name} بعد:`;
                infoEnEl.innerText = `Iqamah for ${prayerNamesEn[activePrayer.name]} prayer in:`;

                const diff = activePrayer.iqamah - now;
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                timerNumEl.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timerNumEl.style.color = "#ff3d00"; 
            } 
            else if (currentState === 'PRAYING') {
                alertBox.style.display = 'block'; 
                
                infoArEl.innerText = `تقام صلاة ${activePrayer.name} الآن`;
                infoEnEl.innerText = `${prayerNamesEn[activePrayer.name]} prayer is in progress`;
                
                timerNumEl.innerText = "00:00"; 
                timerNumEl.style.color = "#00e676"; 
            }
        }

        fetchPrayerTimes();
        setInterval(fetchPrayerTimes, 6 * 60 * 60 * 1000); 
        setInterval(updateScreen, 1000);
        
    </script>
</body>
</html>
